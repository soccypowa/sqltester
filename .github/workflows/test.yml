name: Run unit tests

on:
  push:
    branches:
      - "main"
  pull_request: 
    branches: 
      - "main"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v3
        with:
          go-version: ^1.21
        id: Go
      
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Run tests
        run: make test
